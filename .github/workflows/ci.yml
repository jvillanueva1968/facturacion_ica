name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: facturacion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      SNRI_DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/facturacion
      REDIS_URL: redis://localhost:6379/0
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      LLM_PROVIDER: ollama

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi "uvicorn[standard]" pydantic pydantic-settings python-multipart \
            aiofiles httpx pytesseract opencv-python-headless pillow pdf2image \
            zeep requests-pkcs12 oracledb asyncpg "sqlalchemy[asyncio]" redis \
            structlog python-dotenv tenacity "python-jose[cryptography]" \
            "passlib[bcrypt]" slowapi greenlet \
            pytest pytest-asyncio ruff

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check app tests

      - name: Tests
        env:
          UPLOAD_DIR: ${{ github.workspace }}/uploads
        run: |
          mkdir -p "$UPLOAD_DIR"
          python -m pytest tests/ -v --tb=short
