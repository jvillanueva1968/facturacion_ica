[project]
name = "facturacion-ica"
version = "0.1.0"
description = "Sistema de Facturación Automatizada ICA SNRI + SIGMA"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = {text = "Private"}
authors = [
    {name = "Equipo Desarrollo", email = "dev@ica.gov.co"}
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2",
    "httpx>=0.26",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8",
    "pillow>=10.1",
    "pdf2image>=1.16",
    "zeep>=4.2",
    "requests-pkcs12>=1.10",
    "oracledb>=2.4",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1.15",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "httpx>=0.26",
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
ruff = "^0.1"
mypy = "^1.7"
pre-commit = "^3.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "DTZ", "T20"]
ignore = ["E501"]
per-file-ignores = { "tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]